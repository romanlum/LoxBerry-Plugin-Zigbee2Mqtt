; Hilfetexte zu templates/help/help.html. LBWeb::gethelp() leitet den Namen
; dieser Datei aus dem Namen der Hilfevorlage ab und sucht sie in
; templates/lang/. Die Werte werden nicht maskiert, Auszeichnung bleibt.

[HELP]
TITLE="Zigbee2MQTT auf dem LoxBerry"
INTRO="Das Plugin betreibt zigbee2mqtt als Dienst. zigbee2mqtt spricht über einen Koordinator (USB-Stick oder Netzwerkadapter) mit den Zigbee-Geräten und veröffentlicht jedes Gerät am MQTT-Broker. Das LoxBerry MQTT-Gateway leitet die Werte an den Miniserver weiter."
SETUP_TITLE="Erste Schritte"
SETUP_ADAPTER="Adapter-Pfad: bei einem USB-Stick das Gerät, am besten der feste Name unter /dev/serial/by-id/…; bei einem Netzwerkadapter tcp://IP-Adresse:Port (z. B. SONOFF Dongle-M: tcp://192.168.1.50:6638). Die IP-Adresse ist verlässlicher als ein .local-Name."
SETUP_TYPE="Adapter-Typ: ember für Chips von Silicon Labs (z. B. SONOFF Dongle-E, Dongle-M/Max), zstack für Chips von Texas Instruments (z. B. SONOFF Dongle-P). Baudrate und Flusssteuerung nur, wenn der Hersteller sie vorgibt."
SETUP_MQTT="MQTT: „Verwende MQTT Gateway Anmeldedaten“ und „Topic bei MQTT Plugin registrieren“ einschalten, dann leitet das Gateway die Werte ohne weitere Einrichtung weiter."
SETUP_SAVE="„Speichern und aktualisieren“ schreibt die configuration.yaml und startet den Dienst neu. Die Seite zeigt, ob der Dienst läuft; wenn nicht, nennen die Logdateien den Grund."
PAIR_TITLE="Geräte anlernen"
PAIR_TEXT="zigbee2mqtt 2.x liest „Neue Geräte erlauben“ nicht mehr aus seiner Konfiguration. Das Anlernen in der Zigbee2mqtt UI öffnen (Permit join) oder {&quot;time&quot;: 254} an &lt;Topic&gt;/bridge/request/permit_join senden; es schließt sich nach so vielen Sekunden von selbst. Dann das Gerät in den Anlernmodus bringen, meist den Knopf etwa fünf Sekunden halten, bis es blinkt. Beim Anlernen das Gerät nah an den Koordinator oder einen Router halten."
NAMES_TITLE="Gerätenamen"
NAMES_TEXT="Ein neues Gerät heißt nach seiner IEEE-Adresse. Einen lesbaren Namen vergeben (friendly_name auf der Seite Verbundene Geräte oder in der Zigbee2mqtt UI). Der Name wird Teil des MQTT-Themas und der Eingangsnamen in Loxone – späteres Umbenennen bedeutet neue Eingänge in Loxone."
LOXONE_TITLE="Werte in Loxone"
LOXONE_TEXT="Mit dem MQTT-Gateway in Fassung 1 kommt jeder Wert an einem virtuellen Eingang namens &lt;Topic&gt;_&lt;Gerät&gt;_&lt;Wert&gt; an, z. B. zigbee2mqtt_Kueche_temperature. Mit Fassung 2 die Datenpunkte auf der Abonnement-Seite des Gateways anhaken. Batteriegeräte melden meist nur bei Änderung oder alle paar Minuten."
LOGS_TITLE="Logdateien"
LOGS_TEXT="zigbee2mqtt.log steht unter Logdateien. Die Plugin-Protokolle liegen auf einer RAM-Disk und überstehen keinen Neustart des LoxBerry; wer eine Meldung braucht, kopiert sie vorher heraus."
LINK_DEVICES="unterstützte Geräte"
LINK_ADAPTERS="Adapter"
