; of this file from the name of the help template and looks for it in
; templates/lang/. Values are not escaped, markup stays as it is.

[HELP]
TITLE="Zigbee2MQTT on the LoxBerry"
INTRO="The plugin runs zigbee2mqtt as a service. zigbee2mqtt talks to the Zigbee devices through a coordinator (USB stick or network adapter) and publishes every device on the MQTT broker. The LoxBerry MQTT gateway forwards the values to the Miniserver."
SETUP_TITLE="First steps"
SETUP_ADAPTER="Adapter path: for a USB stick the device, preferably the stable name under /dev/serial/by-id/...; for a network adapter tcp://IP-address:port (e.g. SONOFF Dongle-M: tcp://192.168.1.50:6638). Prefer the IP address to a .local name."
SETUP_TYPE="Adapter type: ember for Silicon Labs chips (e.g. SONOFF Dongle-E, Dongle-M/Max), zstack for Texas Instruments chips (e.g. SONOFF Dongle-P). Baudrate and flow control only if the vendor asks for it."
SETUP_MQTT="MQTT: enable “Use MQTT Gateway credentials” and “Register Topic on MQTT Plugin”, then the gateway forwards the values without further setup."
SETUP_SAVE="“Save and apply” writes configuration.yaml and restarts the service. The page shows whether the service is running; if not, the Logs tell why."
PAIR_TITLE="Pairing devices"
PAIR_TEXT="zigbee2mqtt 2.x no longer reads “Allow new devices” from its configuration. Open pairing in the Zigbee2mqtt UI (Permit join) or send {&quot;time&quot;: 254} to &lt;topic&gt;/bridge/request/permit_join; pairing closes by itself after that many seconds. Then put the device into pairing mode, usually by holding its button for about five seconds until it blinks. Keep the device close to the coordinator or a router while pairing."
NAMES_TITLE="Device names"
NAMES_TEXT="A new device is called by its IEEE address. Give it a readable name (friendly_name on the Devices page or in the Zigbee2mqtt UI). The name becomes part of the MQTT topic and of the input names in Loxone - renaming later means new inputs in Loxone."
LOXONE_TITLE="Values in Loxone"
LOXONE_TEXT="With the MQTT gateway in version 1, each value arrives at a virtual input named &lt;topic&gt;_&lt;device&gt;_&lt;value&gt;, e.g. zigbee2mqtt_Kitchen_temperature. With version 2, tick the data points on the gateway's subscription page. Battery devices usually report only on change or every few minutes."
LOGS_TITLE="Logs"
LOGS_TEXT="zigbee2mqtt.log is listed under Logs. The plugin logs are kept on a RAM disk and do not survive a restart of the LoxBerry; copy a message out before restarting if you need it."
LINK_DEVICES="supported devices"
LINK_ADAPTERS="adapters"
