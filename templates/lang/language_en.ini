[Loxone]
Desc="How the values of the Zigbee devices get into the Miniserver, step by step."
Step1="Way to the Miniserver"
OwnBroker="The plugin uses its own MQTT broker, not the one of the LoxBerry MQTT gateway. The values only reach the Miniserver if something forwards them from that broker."
GatewayV1="zigbee2mqtt publishes every device as JSON on <topic>/<device name>. The LoxBerry MQTT gateway (version 1) forwards subscribed topics to the Miniserver and splits the JSON into one virtual input per value."
GatewayV2="The LoxBerry MQTT gateway runs as version 2: there is nothing to enter here. The devices appear on the gateway page under Subscriptions, where the data points are ticked."
GatewayUdp="The MQTT gateway sends by UDP. The input names below and the template apply to the HTTP mode only; in UDP mode the topics reach the Miniserver with slashes."
Step2="Subscription in the MQTT gateway"
Subscription="The gateway needs this subscription:"
SubscriptionNow="Subscribed now:"
SubscriptionMissing="The gateway has no subscription for this plugin - nothing reaches the Miniserver. Enable “Register Topic on MQTT Plugin” in the settings and press “Save and apply”."
Step3="Virtual inputs"
InputsDesc="The gateway sends each value to a virtual input with exactly this name. Create them in Loxone Config (Virtual Inputs, Virtual Input) with the name as title, or import the template below."
InputName="Name of the virtual input"
Unit="Unit"
Meaning="Meaning"
Skipped="%d further values are text or composite values and get no analog input."
NoState="These devices have not sent any value yet, so all their values are listed:"
Rename="Renaming a device in zigbee2mqtt changes the names of its inputs; the inputs with the old name then stay empty."
NoInputs="No values to list yet - pair a device first."
NoBroker="No connection to the MQTT broker - check the MQTT settings."
NoAnswer="zigbee2mqtt did not answer - is the service running?"
Step4="Create all inputs at once"
TemplateDesc="The template contains all inputs of the table above."
TemplateButton="Create template for Loxone Config"
TemplateImport="In Loxone Config: Virtual Inputs, Predefined HTTP devices, Import template. The template uses a virtual HTTP input with the address http://localhost and a polling time of one week only as a container; the gateway writes to the inputs by name."
TemplateTwice="Loxone Config creates new inputs on every import and overwrites nothing: importing twice creates every input twice, and only one of them receives values."
StepCheck="Check"
Check="Open the incoming data of the MQTT gateway (System, MQTT Gateway): the values of the devices must appear there. If they arrive there but not in Loxone, compare the input names with the table above."

