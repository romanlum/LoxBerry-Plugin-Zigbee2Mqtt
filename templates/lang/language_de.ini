HintBaudrate="Baudrate der seriellen Verbindung. Leer lassen, dann bleibt der Wert in der configuration.yaml unveraendert und zigbee2mqtt waehlt selbst. Der SONOFF Dongle Max braucht 115200."
LabelRtscts="Hardware-Flusssteuerung (rtscts)"
