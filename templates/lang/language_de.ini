[Loxone]
Desc="Wie die Werte der Zigbee-Geräte in den Miniserver kommen, Schritt für Schritt."
Step1="Weg zum Miniserver"
OwnBroker="Das Plugin verwendet einen eigenen MQTT-Broker, nicht den des LoxBerry MQTT-Gateways. Die Werte kommen nur dann im Miniserver an, wenn etwas sie von diesem Broker weiterleitet."
GatewayV1="zigbee2mqtt veröffentlicht jedes Gerät als JSON unter <Topic>/<Gerätename>. Das LoxBerry MQTT-Gateway (Fassung 1) leitet abonnierte Themen an den Miniserver weiter und zerlegt das JSON in einen virtuellen Eingang je Wert."
GatewayV2="Das LoxBerry MQTT-Gateway läuft in Fassung 2: hier ist nichts einzutragen. Die Geräte erscheinen auf der Gateway-Seite unter Abonnements; dort werden die Datenpunkte angehakt."
GatewayUdp="Das MQTT-Gateway sendet per UDP. Die Eingangsnamen unten und die Vorlage gelten nur für den HTTP-Betrieb; im UDP-Betrieb kommen die Themen mit Schrägstrichen am Miniserver an."
Step2="Abo im MQTT-Gateway"
Subscription="Das Gateway braucht dieses Abo:"
SubscriptionNow="Jetzt abonniert:"
SubscriptionMissing="Das Gateway hat kein Abo für dieses Plugin – am Miniserver kommt nichts an. In den Einstellungen „Topic bei MQTT Plugin registrieren“ einschalten und „Speichern und aktualisieren“ drücken."
Step3="Virtuelle Eingänge"
InputsDesc="Das Gateway schickt jeden Wert an einen virtuellen Eingang mit genau diesem Namen. In Loxone Config anlegen (Virtuelle Eingänge, Virtueller Eingang) mit dem Namen als Bezeichnung – oder die Vorlage unten importieren."
InputName="Name des virtuellen Eingangs"
Unit="Einheit"
Meaning="Bedeutung"
Skipped="%d weitere Werte sind Texte oder zusammengesetzte Werte und bekommen keinen Analogeingang."
NoState="Diese Geräte haben noch keinen Wert gesendet, deshalb stehen alle ihre Werte in der Liste:"
Rename="Wer ein Gerät in zigbee2mqtt umbenennt, ändert die Namen seiner Eingänge; die Eingänge mit dem alten Namen bleiben dann leer."
NoInputs="Noch keine Werte aufzulisten – zuerst ein Gerät anlernen."
NoBroker="Keine Verbindung zum MQTT-Broker – MQTT-Einstellungen prüfen."
NoAnswer="zigbee2mqtt hat nicht geantwortet – läuft der Dienst?"
Step4="Alles auf einmal anlegen"
TemplateDesc="Die Vorlage enthält alle Eingänge der Tabelle oben."
TemplateButton="Vorlage für Loxone Config erzeugen"
TemplateImport="In Loxone Config: Virtuelle Eingänge, Vordefinierte HTTP-Geräte, Vorlage importieren. Die Vorlage benutzt einen virtuellen HTTP-Eingang mit der Adresse http://localhost und einer Abfragezeit von einer Woche nur als Behälter; das Gateway schreibt über den Namen in die Eingänge."
TemplateTwice="Loxone Config legt beim Import neu an und überschreibt nichts: zweimal importiert ergibt jeden Eingang doppelt, und nur einer davon bekommt Werte."
StepCheck="Gegenprobe"
Check="Die eingehenden Daten des MQTT-Gateways öffnen (System, MQTT Gateway): dort müssen die Werte der Geräte erscheinen. Kommen sie dort an, aber nicht in Loxone, die Eingangsnamen mit der Tabelle oben vergleichen."

